<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout: one landscape 16:9 view onto a spread of graph-paper pages (the camera moves between them), a player bar, then chapter chips. The pages are always cream paper; only the desk around the player follows the theme. */
:root{
  --bg:#E9E6D6; --ink:#1A1A1A; --dim:#6B6A60; --line:#CFCBB8; --raise:#F6F6EA; --accent:#1E5631; --shadow:0 1px 2px rgba(40,36,20,.10),0 12px 36px rgba(40,36,20,.16);
  --hand:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --w:min(1600px,calc(100vw - 32px),calc((100dvh - 170px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#161613; --ink:#ECEBE2; --dim:#9A998F; --line:#3A3933; --raise:#22221E; --accent:#8CCF9F; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.5); }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#161613; --ink:#ECEBE2; --dim:#9A998F; --line:#3A3933; --raise:#22221E; --accent:#8CCF9F; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.5); }
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased}
.shell{box-sizing:border-box;min-height:calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:12px 16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.page{position:relative;width:max(300px,var(--w));max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:#E3DFCB}
#bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:0;background:rgba(30,86,49,.92);color:#F6F6EA;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#bigplay[hidden]{display:none}
#bigplay svg{width:34px;height:34px;margin-left:5px}
#stage{display:block;width:100%;height:100%;cursor:pointer}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hand);font-size:22px;color:#77766C;pointer-events:none}
#loading[hidden]{display:none}
.bar,.chapters{width:max(300px,var(--w));max-width:100%}
.bar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.play:hover{border-color:var(--accent)}
.scrub{position:relative;flex:1 1 260px;min-width:0;height:30px;display:flex;align-items:center}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer}
#seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) 0 calc(var(--p,0)*100%),var(--line) calc(var(--p,0)*100%) 100%)}
#seek::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
#seek::-moz-range-progress{height:4px;background:var(--accent)}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-5px;border:0}
#seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:0}
.ticks{position:absolute;left:0;right:0;top:50%;height:0;pointer-events:none}
.ticks i{position:absolute;top:-6px;width:2px;height:12px;border-radius:1px;background:var(--dim);opacity:.55}
.ticks i.d{top:-3px;height:6px;opacity:.4}
.ctl{flex:none;font-family:var(--ui);font-size:13px;background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.ctl:hover{border-color:var(--accent)}
.ctl[aria-pressed="false"]{color:var(--dim)}
.skip{border-color:var(--accent);color:var(--accent)}
select.ctl{padding:5px 8px;border-radius:8px}
.clock{flex:none;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.chapters{display:flex;flex-direction:column;gap:6px}
.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chapters button{display:flex;align-items:baseline;gap:7px;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--dim);padding:5px 12px;font-family:var(--hand);font-size:17px;cursor:pointer}
.chapters button .n{font-size:14px;color:var(--accent)}
.chapters button.dd{border-style:dashed;font-size:15px;padding:3px 10px}
.chapters button.dd .n{font-family:var(--ui);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.chapters button:hover{color:var(--ink)}
.chapters button.on{color:var(--ink);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{width:max(300px,var(--w));max-width:100%;margin:0;font-size:12px;color:var(--dim)}
@media (max-width:640px){ .chapters button{font-size:15px;padding:4px 10px} }
/* render mode: exactly one 1920×1080 page, nothing else */
html.render,html.render body{background:#E3DFCB}
html.render .shell{padding:0;gap:0;min-height:0;display:block}
html.render .page{width:1920px;height:1080px;max-width:none;border-radius:0;box-shadow:none}
html.render .bar,html.render .chapters,html.render .note{display:none}
</style>

<div class="shell">
  <div class="page">
    <svg id="stage" viewBox="0 0 1920 1080" role="img" aria-label="{{ARIA}}">
      <defs id="defs"></defs>
      <rect width="1920" height="1080" fill="#E3DFCB"/>
      <g id="scenes"></g>
      <g id="caps" style="display:none"></g>
    </svg>
    <div id="loading">sharpening pencils…</div>
    <button id="bigplay" type="button" aria-label="Play with narration" hidden><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 1.8v10.4a.6.6 0 0 0 .9.5l8.2-5.2a.6.6 0 0 0 0-1L4.4 1.3a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg></button>
  </div>
  <div class="bar">
    <button class="play" id="play" type="button" aria-label="Play"></button>
    <div class="scrub"><input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position in the video"><div class="ticks" id="ticks"></div></div>
    <span class="clock" id="clock">0:00 / 0:00</span>
    <button class="ctl" id="cc" type="button" aria-pressed="false" title="Subtitles (C)">CC</button>
    <select class="ctl" id="speed" aria-label="Playback speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
  </div>
  <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
  <p class="note" id="note"></p>
</div>
